name: IAmecc CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clona il codice del repository
        uses: actions/checkout@v4

      - name: 🟢 Configura Node.js (per il Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Installa le dipendenze del Backend
        run: |
          cd backend
          npm install

      - name: 🐦 Configura Flutter (per il Frontend)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: 📦 Installa le dipendenze di Flutter
        run: |
          cd frontend
          flutter pub get

      - name: 🧪 Esegui il controllo del codice Flutter
        run: |
          cd frontend
          flutter analyze
